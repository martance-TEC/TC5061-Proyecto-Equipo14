name: Pruebas y despliegue de operación

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, monitoring]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar entorno de pruebas
        shell: bash
        run: |
          python -m pip install pip==26.2.2 setuptools==78.1.0 wheel==0.45.1
          if [ '${{ matrix.suite }}' = monitoring ]; then
            python -m pip install -r requirements-monitoring.lock.txt
          else
            python -m pip install -r requirements-quality.lock.txt
          fi
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Ejecutar pruebas
        env:
          DO_NOT_TRACK: '1'
          MPLBACKEND: Agg
        shell: bash
        run: |
          mkdir -p data/ci
          if [ '${{ matrix.suite }}' = monitoring ]; then
            python -m pytest tests/test_monitoring.py -q --junitxml=data/ci/monitoring.xml
          else
            python -m pytest tests -q --ignore=tests/test_service_integration.py --ignore=tests/test_monitoring.py --junitxml=data/ci/unit.xml
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-${{ matrix.suite }}
          path: data/ci/*.xml
          if-no-files-found: warn

  deploy-check:
    needs: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MIBICI_IMAGE: localhost/mibici-p1:${{ github.sha }}
      BOOTSTRAP_SMOKE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir imagen OCI
        run: docker compose -f docker-compose.yml build
      - name: Desplegar en el runner y esperar disponibilidad
        run: |
          mkdir -p data/operacion data/ci
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 240
      - name: Comprobar HTTP y carga desde el Registry
        run: |
          docker compose exec -T api python -m mibici_equipo14.operation_check --url http://api:8000 --tracking-uri http://mlflow:5000 > data/ci/http.json
          cat data/ci/http.json
      - name: Conservar el diagnóstico
        if: always()
        run: docker compose logs --no-color > data/ci/compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: despliegue-runner
          path: data/ci/
      - name: Detener el despliegue temporal
        if: always()
        run: docker compose down
